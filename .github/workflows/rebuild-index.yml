name: rebuild-index
on:
  push: {branches: [main], paths: ['measurements/**', 'registry/**']}
permissions: {contents: write}
concurrency:
  group: rebuild-measurement-index
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Rebuild and publish generated index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/rebuild_index.py
            git add data/measurements.csv
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Rebuild measurement index'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
