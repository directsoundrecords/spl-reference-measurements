name: validate-contribution
on: {pull_request: {}}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema Pillow
      - run: python tools/validate_measurement.py
      - run: python tools/rebuild_index.py && git diff --exit-code data/measurements.csv
