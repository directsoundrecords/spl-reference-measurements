name: validate-contribution
on: {pull_request: {}}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema Pillow
      - name: Validate canonical measurements
        run: python tools/validate_measurement.py
      - name: Test catalogue generation contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check catalogue JavaScript syntax
        run: node --check docs/assets/app.js
