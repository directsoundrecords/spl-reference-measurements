name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "measurements/**"
      - "registry/**"
      - "tools/**"
      - "tests/**"
      - "schemas/**"
      - "taxonomy/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema Pillow
      - name: Validate canonical measurements
        run: python tools/validate_measurement.py
      - name: Test catalogue generation contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check catalogue JavaScript syntax
        run: node --check docs/assets/app.js
      - name: Build static HTML, JSON, CSV and photographs
        run: python tools/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
